name: Publicar Release Automática

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versão da release (ex: v3.1.0)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compilar Executável com PyInstaller
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed --icon "assets\icon.ico" --name "MidnightOptimizer" --add-data "index.html;." --add-data "styles.css;." --add-data "renderer.js;." --add-data "assets;assets" app.py

      - name: Empacotar Ficheiros para Distribuição
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release_dist
          Copy-Item "dist\MidnightOptimizer.exe" -Destination "release_dist\MidnightOptimizer.exe"
          Copy-Item "README.md" -Destination "release_dist\README.md"
          Compress-Archive -Path "release_dist\*" -DestinationPath "MidnightOptimizer-Windows-x64.zip" -Force

      - name: Publicar Release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MidnightOptimizer.exe
            MidnightOptimizer-Windows-x64.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
