<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b0d14"/>
      <stop offset="60%" stop-color="#121622"/>
      <stop offset="100%" stop-color="#181d2c"/>
    </linearGradient>
    <linearGradient id="gun_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="glow_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Viewport Background -->
  <rect width="320" height="180" fill="url(#bg_grad)"/>
  
  <!-- Subtle Grid / Tactical Depth Lines -->
  <line x1="0" y1="120" x2="320" y2="120" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="80" y1="180" x2="140" y2="120" stroke="#1e293b" stroke-width="0.7"/>
  <line x1="240" y1="180" x2="180" y2="120" stroke="#1e293b" stroke-width="0.7"/>

  <!-- Center Crosshair (Precision Reticle) -->
  <g stroke="#10b981" stroke-width="1.5">
    <line x1="160" y1="84" x2="160" y2="88"/>
    <line x1="160" y1="92" x2="160" y2="96"/>
    <line x1="154" y1="90" x2="158" y2="90"/>
    <line x1="162" y1="90" x2="166" y2="90"/>
  </g>

  <!-- Weapon Model: Classic Pro (Moderate Lower Right, x=2.5, y=0, z=-1.5) -->
  <g transform="translate(195, 96)">
    <!-- Barrel & Receiver -->
    <path d="M 0,26 L 40,24 L 54,20 L 78,16 L 82,24 L 70,29 L 52,34 L 14,42 Z" fill="url(#gun_grad)" stroke="#475569" stroke-width="1.2"/>
    <!-- Sight / Rail -->
    <rect x="22" y="16" width="30" height="7" rx="1.5" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
    <!-- Magazine -->
    <path d="M 32,38 L 44,70 L 32,74 L 22,40 Z" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <!-- Handguard & Foregrip Hand -->
    <path d="M 48,22 L 68,20 L 65,36 L 46,38 Z" fill="#475569"/>
    <!-- Player Arm & Sleeve (Lower Right Angle) -->
    <path d="M 40,55 L 75,44 L 125,84 L 80,84 Z" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <!-- Hand Silhouette -->
    <ellipse cx="64" cy="46" rx="9" ry="6" fill="#64748b" transform="rotate(-15 64 46)"/>
  </g>

  <!-- Technical Spec Watermark -->
  <rect x="12" y="12" width="118" height="20" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="18" y="25" fill="#38bdf8" font-family="Segoe UI, sans-serif" font-size="9" font-weight="bold">CLÁSSICO PRO</text>
  <text x="82" y="25" fill="#64748b" font-family="Segoe UI, sans-serif" font-size="8">FOV 68</text>

  <text x="308" y="168" fill="#475569" font-family="Segoe UI, monospace" font-size="8" text-anchor="end">x:2.5 y:0 z:-1.5</text>
</svg>
