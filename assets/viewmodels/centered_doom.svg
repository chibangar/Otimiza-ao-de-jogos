<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b0d14"/>
      <stop offset="60%" stop-color="#121622"/>
      <stop offset="100%" stop-color="#181d2c"/>
    </linearGradient>
    <linearGradient id="gun_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="25%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Viewport Background -->
  <rect width="320" height="180" fill="url(#bg_grad)"/>
  
  <!-- Subtle Grid / Tactical Depth Lines -->
  <line x1="0" y1="120" x2="320" y2="120" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="80" y1="180" x2="140" y2="120" stroke="#1e293b" stroke-width="0.7"/>
  <line x1="240" y1="180" x2="180" y2="120" stroke="#1e293b" stroke-width="0.7"/>

  <!-- Center Crosshair (Precision Reticle) -->
  <g stroke="#10b981" stroke-width="1.5">
    <line x1="160" y1="84" x2="160" y2="88"/>
    <line x1="160" y1="92" x2="160" y2="96"/>
    <line x1="154" y1="90" x2="158" y2="90"/>
    <line x1="162" y1="90" x2="166" y2="90"/>
  </g>

  <!-- Weapon Model: Centered Retro (Simétrico no Centro Inferior, x=-2, y=2, z=-2) -->
  <g transform="translate(138, 102)">
    <!-- Central Barrel & Top Receiver -->
    <path d="M 12,18 L 32,18 L 36,36 L 40,78 L 4,78 L 8,36 Z" fill="url(#gun_grad)" stroke="#d97706" stroke-width="1.1"/>
    <!-- Muzzle / Flash Hider -->
    <rect x="18" y="10" width="8" height="8" rx="1" fill="#f59e0b"/>
    <!-- Symmetrical Sight -->
    <rect x="19" y="18" width="6" height="5" rx="1" fill="#1e293b" stroke="#fcd34d" stroke-width="0.8"/>
    <!-- Left Hand -->
    <ellipse cx="6" cy="56" rx="9" ry="6" fill="#475569" transform="rotate(30 6 56)"/>
    <!-- Right Hand -->
    <ellipse cx="38" cy="56" rx="9" ry="6" fill="#475569" transform="rotate(-30 38 56)"/>
    <!-- Hands & Forearms Bottom -->
    <path d="M -8,78 L 52,78 L 46,65 L -2,65 Z" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  </g>

  <!-- Technical Spec Watermark -->
  <rect x="12" y="12" width="138" height="20" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="18" y="25" fill="#f59e0b" font-family="Segoe UI, sans-serif" font-size="9" font-weight="bold">CENTRADO / DOOM</text>
  <text x="110" y="25" fill="#64748b" font-family="Segoe UI, sans-serif" font-size="8">SIMÉTRICO</text>

  <text x="308" y="168" fill="#475569" font-family="Segoe UI, monospace" font-size="8" text-anchor="end">x:-2 y:2 z:-2</text>
</svg>
