<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b0d14"/>
      <stop offset="60%" stop-color="#121622"/>
      <stop offset="100%" stop-color="#181d2c"/>
    </linearGradient>
    <linearGradient id="gun_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="30%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Viewport Background -->
  <rect width="320" height="180" fill="url(#bg_grad)"/>
  
  <!-- Subtle Grid / Tactical Depth Lines -->
  <line x1="0" y1="120" x2="320" y2="120" stroke="#1e293b" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="80" y1="180" x2="140" y2="120" stroke="#1e293b" stroke-width="0.7"/>
  <line x1="240" y1="180" x2="180" y2="120" stroke="#1e293b" stroke-width="0.7"/>

  <!-- Center Crosshair (Precision Reticle) -->
  <g stroke="#10b981" stroke-width="1.5">
    <line x1="160" y1="84" x2="160" y2="88"/>
    <line x1="160" y1="92" x2="160" y2="96"/>
    <line x1="154" y1="90" x2="158" y2="90"/>
    <line x1="162" y1="90" x2="166" y2="90"/>
  </g>

  <!-- Weapon Model: Max FOV (Further Out, Extended Barrel, x=2.5, y=2, z=-1) -->
  <g transform="translate(182, 82)">
    <!-- Long Barrel & Receiver -->
    <path d="M 0,30 L 48,26 L 68,22 L 98,16 L 102,25 L 86,30 L 62,38 L 18,48 Z" fill="url(#gun_grad)" stroke="#60a5fa" stroke-width="1.1"/>
    <!-- Scope / Rail Outline -->
    <rect x="28" y="16" width="38" height="9" rx="2" fill="#1e293b" stroke="#93c5fd" stroke-width="0.9"/>
    <!-- Magazine -->
    <path d="M 40,42 L 52,78 L 38,82 L 28,44 Z" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <!-- Forward Handguard & Grip Hand -->
    <path d="M 58,24 L 84,20 L 80,40 L 55,42 Z" fill="#475569"/>
    <!-- Arm -->
    <path d="M 48,60 L 90,46 L 138,98 L 90,98 Z" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <!-- Hand -->
    <ellipse cx="76" cy="50" rx="10" ry="7" fill="#64748b" transform="rotate(-15 76 50)"/>
  </g>

  <!-- Technical Spec Watermark -->
  <rect x="12" y="12" width="138" height="20" rx="4" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="18" y="25" fill="#60a5fa" font-family="Segoe UI, sans-serif" font-size="9" font-weight="bold">FOV MÁXIMO / AWP</text>
  <text x="108" y="25" fill="#64748b" font-family="Segoe UI, sans-serif" font-size="8">PRESET 3</text>

  <text x="308" y="168" fill="#475569" font-family="Segoe UI, monospace" font-size="8" text-anchor="end">x:2.5 y:2 z:-1</text>
</svg>
